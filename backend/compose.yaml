# Local development stack (Laravel Sail). See docs/SETUP.md.
#
# `laravel.test` serves the API and the Filament back office. `queue`,
# `scheduler` and `reverb` run from the same image so `sail up -d` starts
# everything the ordering flow needs: emails, push notifications, webhook
# processing, the timed jobs that cancel unpaid orders and auto-reject stale
# ones, and live order updates over WebSockets (port 8080). Only
# laravel.test builds the image; the others reuse it, because parallel builds
# of one tag race each other.
x-sail-app: &sail-app
    image: 'sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        SUPERVISOR_PHP_USER: '${SUPERVISOR_PHP_USER:-sail}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD:-}'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail

services:
    laravel.test:
        <<: *sail-app
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        ports:
            - '${APP_PORT:-80}:80'
        depends_on:
            - mysql
            - mailpit
    queue:
        <<: *sail-app
        pull_policy: never
        command: ['php', 'artisan', 'queue:listen', '--tries=3', '--timeout=90']
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
    scheduler:
        <<: *sail-app
        pull_policy: never
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
    reverb:
        <<: *sail-app
        pull_policy: never
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        restart: unless-stopped
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            interval: 5s
            retries: 20
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
