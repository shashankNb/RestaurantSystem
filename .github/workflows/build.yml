name: Build & Deploy FoodHub to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pull everything from Github Repo
      - name: 🚀 SSH into Server and pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/plexuslogics.com/public_html/foodhub
            echo "🔄 Pulling latest changes..."
            git fetch origin master
            git reset --hard origin/master
            echo "✅ Deployment successful at $(date)"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: |
          npm install
     
      # npx expo export --platform web and copy it into app/dist
      - name: Build React app
        working-directory: ./app
        run: npx expo export --platform web

      - name: Deploy via SSH to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "app/dist/*"
          target: "~/domains/plexuslogics.com/public_html/foodhub/app/dist"
          strip_components: 2
          overwrite: true
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
